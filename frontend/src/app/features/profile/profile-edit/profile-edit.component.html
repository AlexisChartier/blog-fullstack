<div class="max-w-2xl mx-auto mt-4 sm:mt-8 animate-fade-in">
  <h1 class="text-2xl sm:text-3xl font-bold text-gray-900 dark:text-white mb-6">Edit Profile</h1>

  <div *ngIf="success()" class="bg-green-50 dark:bg-green-900/20 text-green-700 dark:text-green-400 px-4 py-3 rounded-lg mb-4 text-sm flex items-center gap-2 animate-fade-in">
    <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
    Profile updated successfully.
  </div>
  <div *ngIf="error()" class="bg-red-50 dark:bg-red-900/20 text-red-700 dark:text-red-400 px-4 py-3 rounded-lg mb-4 text-sm flex items-center gap-2">
    <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
    {{ error() }}
  </div>

  <div class="card p-6">
    <form (ngSubmit)="submit()" class="space-y-5">
      <!-- Avatar -->
      <div class="flex items-center gap-4 mb-2">
        <div class="w-16 h-16 rounded-full overflow-hidden bg-gradient-to-br from-primary-500 to-accent-500 flex items-center justify-center text-white text-xl font-bold flex-shrink-0">
          <img *ngIf="avatarUrl() && !avatarUrl()?.startsWith('data:')"
               [src]="'/storage/' + avatarUrl()"
               [alt]="name()"
               class="w-full h-full object-cover"
               onerror="this.style.display='none'" />
          <img *ngIf="avatarUrl()?.startsWith('data:')"
               [src]="avatarUrl()"
               [alt]="name()"
               class="w-full h-full object-cover" />
          <span *ngIf="!avatarUrl()">{{ name().charAt(0) || 'U' }}</span>
        </div>
        <div>
          <label for="avatar" class="btn-secondary text-sm cursor-pointer">
            <svg class="w-4 h-4 mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
            Upload Avatar
          </label>
          <input id="avatar" type="file" accept="image/*" (change)="onFileSelected($event)" class="hidden" />
          <p class="text-xs text-gray-400 dark:text-gray-600 mt-1.5">PNG, JPG up to 2MB</p>
        </div>
      </div>

      <div>
        <label for="name" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">Name</label>
        <input id="name" type="text" [(ngModel)]="name" name="name" class="input" required />
      </div>
      <div>
        <label for="username" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">Username</label>
        <input id="username" type="text" [(ngModel)]="username" name="username" class="input" required />
      </div>
      <div>
        <label for="bio" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">Bio</label>
        <textarea id="bio" [(ngModel)]="bio" name="bio" rows="4" class="input resize-none" placeholder="Tell us about yourself..."></textarea>
      </div>
      <div class="flex gap-3 pt-1">
        <button type="submit" [disabled]="saving()" class="btn-primary disabled:opacity-50 disabled:cursor-not-allowed">
          <span *ngIf="!saving()">Save Changes</span>
          <span *ngIf="saving()">Saving...</span>
        </button>
        <a routerLink="/" class="btn-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
