<div class="max-w-2xl mx-auto mt-8">
  <h1 class="text-3xl font-bold text-gray-900 mb-6">Edit Profile</h1>

  <div *ngIf="success()" class="bg-green-50 text-green-700 p-3 rounded-md mb-4">Profile updated successfully.</div>
  <div *ngIf="error()" class="bg-red-50 text-red-700 p-3 rounded-md mb-4">{{ error() }}</div>

  <form (ngSubmit)="submit()" class="space-y-4">
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Name</label>
      <input type="text" [(ngModel)]="name" name="name" class="input" required />
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
      <input type="text" [(ngModel)]="username" name="username" class="input" required />
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Bio</label>
      <textarea [(ngModel)]="bio" name="bio" rows="4" class="input" placeholder="Tell us about yourself..."></textarea>
    </div>
    <button type="submit" [disabled]="saving()" class="btn-primary disabled:opacity-50">
      {{ saving() ? 'Saving...' : 'Save Changes' }}
    </button>
  </form>
</div>
