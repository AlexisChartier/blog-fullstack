<div *ngIf="loading()" class="text-center py-12 text-gray-500">Loading...</div>

<div *ngIf="user() as u" class="space-y-8">
  <div class="card">
    <div class="flex items-start gap-6">
      <div class="w-20 h-20 bg-primary-100 rounded-full flex items-center justify-center text-primary-700 text-2xl font-bold">
        {{ u.name.charAt(0) }}
      </div>
      <div class="flex-1">
        <h1 class="text-2xl font-bold text-gray-900">{{ u.name }}</h1>
        <p class="text-gray-500"><span>&#64;</span>{{u.username}}</p>
        <p *ngIf="u.bio" class="text-gray-700 mt-3">{{ u.bio }}</p>
        <div class="flex gap-4 mt-3 text-sm text-gray-500">
          <span>Member since {{ u.created_at | date: 'mediumDate' }}</span>
          <span>{{ u.posts?.length || 0 }} posts</span>
        </div>
      </div>
    </div>
  </div>

  <div>
    <h2 class="text-xl font-bold text-gray-900 mb-4">Recent Posts</h2>
    <div class="space-y-4">
      <article *ngFor="let post of posts()" class="card hover:shadow-md transition-shadow">
        <a [routerLink]="['/post', post.slug]" class="no-underline">
          <h3 class="text-lg font-bold text-gray-900 hover:text-primary-600">{{ post.title }}</h3>
        </a>
        <p class="text-sm text-gray-500 mt-1">{{ post.published_at | date: 'mediumDate' }}</p>
        <p class="text-gray-600 mt-2">{{ post.excerpt }}</p>
      </article>
      <p *ngIf="posts().length === 0" class="text-gray-500 text-center py-4">No posts yet.</p>
    </div>
  </div>
</div>
