<div class="space-y-6 animate-fade-in">
  <div class="flex items-center justify-between flex-wrap gap-4">
    <div>
      <h1 class="text-2xl sm:text-3xl font-bold text-gray-900 dark:text-white">Categories</h1>
      <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">Manage blog categories</p>
    </div>
    <button *ngIf="!showForm()" (click)="startCreate()" class="btn-primary">
      <svg class="w-4 h-4 mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
      New Category
    </button>
  </div>

  <div *ngIf="showForm()" class="card p-6 space-y-4">
    <h2 class="text-lg font-semibold text-gray-900 dark:text-white">{{ editingId() !== null ? 'Edit Category' : 'New Category' }}</h2>

    <div *ngIf="error()" class="bg-red-50 dark:bg-red-900/20 text-red-700 dark:text-red-400 px-4 py-3 rounded-lg text-sm">
      {{ error() }}
    </div>

    <div>
      <label for="cat-name" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">Name</label>
      <input id="cat-name" type="text" [(ngModel)]="name" name="name" class="input" placeholder="Category name..." required />
    </div>

    <div>
      <label for="cat-desc" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">Description</label>
      <textarea id="cat-desc" [(ngModel)]="description" name="description" rows="2" class="input resize-none" placeholder="Optional description..."></textarea>
    </div>

    <div class="flex gap-3">
      <button type="button" (click)="submit()" [disabled]="saving()" class="btn-primary disabled:opacity-50 disabled:cursor-not-allowed">
      <span *ngIf="!saving()">{{ editingId() !== null ? 'Update' : 'Create' }}</span>
      <span *ngIf="saving()">Saving...</span>
      </button>
      <button type="button" (click)="cancelForm()" class="btn-secondary">Cancel</button>
    </div>
  </div>

  <div *ngIf="loading()" class="card p-6 space-y-3">
    <div *ngFor="let i of [1,2,3]" class="skeleton h-12 w-full"></div>
  </div>

  <div *ngIf="!loading()" class="card overflow-hidden p-0">
    <div class="hidden md:block">
      <table class="w-full">
        <thead class="bg-gray-50 dark:bg-gray-800/50 border-b border-gray-200 dark:border-gray-800">
          <tr>
            <th class="text-left px-6 py-3 text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wider">Name</th>
            <th class="text-left px-6 py-3 text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wider">Slug</th>
            <th class="text-left px-6 py-3 text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wider">Posts</th>
            <th class="text-right px-6 py-3 text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wider">Actions</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-gray-200 dark:divide-gray-800">
          <tr *ngFor="let cat of categories()" class="hover:bg-gray-50 dark:hover:bg-gray-800/30 transition-colors">
            <td class="px-6 py-4 font-medium text-gray-900 dark:text-white">{{ cat.name }}</td>
            <td class="px-6 py-4 text-sm text-gray-500 dark:text-gray-400 font-mono">{{ cat.slug }}</td>
            <td class="px-6 py-4 text-sm text-gray-500 dark:text-gray-400">{{ cat.posts_count ?? 0 }}</td>
            <td class="px-6 py-4 text-right">
              <div class="flex items-center justify-end gap-2">
                <button (click)="startEdit(cat)" class="btn-ghost text-sm" title="Edit">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
                </button>
                <button (click)="deleteCategory(cat.id)" class="btn-ghost text-sm text-red-600 hover:bg-red-50 dark:hover:bg-red-900/20" title="Delete">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                </button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="md:hidden divide-y divide-gray-200 dark:divide-gray-800">
      <div *ngFor="let cat of categories()" class="p-4">
        <div class="font-medium text-gray-900 dark:text-white mb-1">{{ cat.name }}</div>
        <div class="text-sm text-gray-500 dark:text-gray-400 font-mono mb-2">{{ cat.slug }}</div>
        <div class="flex items-center justify-between">
          <span class="text-sm text-gray-500 dark:text-gray-400">{{ cat.posts_count ?? 0 }} posts</span>
          <div class="flex gap-2">
            <button (click)="startEdit(cat)" class="btn-ghost text-sm">Edit</button>
            <button (click)="deleteCategory(cat.id)" class="btn-ghost text-sm text-red-600 hover:bg-red-50 dark:hover:bg-red-900/20">Delete</button>
          </div>
        </div>
      </div>
    </div>

    <div *ngIf="categories().length === 0" class="text-center py-16">
      <p class="text-gray-500 dark:text-gray-400 mb-2">No categories yet.</p>
      <button (click)="startCreate()" class="btn-primary text-sm mt-2">Create your first category</button>
    </div>
  </div>
</div>
