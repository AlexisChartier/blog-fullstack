<div class="space-y-6 animate-fade-in">
  <h1 class="text-2xl sm:text-3xl font-bold text-gray-900 dark:text-white">User Management</h1>

  <div *ngIf="error()" class="bg-red-50 dark:bg-red-900/20 text-red-700 dark:text-red-400 px-4 py-3 rounded-lg text-sm">
    {{ error() }}
  </div>

  <div *ngIf="loading()" class="space-y-3">
    <div *ngFor="let i of [1,2,3,4,5]" class="card p-5">
      <div class="skeleton h-5 w-1/3 mb-3"></div>
      <div class="skeleton h-4 w-1/2"></div>
    </div>
  </div>

  <div *ngIf="!loading()" class="card overflow-hidden p-0">
    <table class="w-full">
      <thead>
        <tr class="border-b border-gray-200 dark:border-gray-800 bg-gray-50 dark:bg-gray-900/50">
          <th class="text-left px-5 py-3 text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wider">User</th>
          <th class="text-left px-5 py-3 text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wider hidden md:table-cell">Email</th>
          <th class="text-left px-5 py-3 text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wider hidden sm:table-cell">Posts</th>
          <th class="text-left px-5 py-3 text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wider hidden lg:table-cell">Comments</th>
          <th class="text-left px-5 py-3 text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wider">Role</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let user of users()" class="border-b border-gray-100 dark:border-gray-800/50 hover:bg-gray-50 dark:hover:bg-gray-900/30 transition-colors">
          <td class="px-5 py-4">
            <div class="flex items-center gap-3">
              <div class="w-8 h-8 bg-gradient-to-br from-primary-400 to-accent-400 rounded-full flex items-center justify-center text-white text-xs font-bold flex-shrink-0">
                {{ user.name.charAt(0) }}
              </div>
              <div>
                <p class="font-medium text-gray-900 dark:text-white">{{ user.name }}</p>
                <p class="text-xs text-gray-400"><span>&#64;</span>{{ user.username }}</p>
              </div>
            </div>
          </td>
          <td class="px-5 py-4 text-sm text-gray-500 dark:text-gray-400 hidden md:table-cell">{{ user.email }}</td>
          <td class="px-5 py-4 text-sm text-gray-500 dark:text-gray-400 hidden sm:table-cell">{{ user.posts_count ?? 0 }}</td>
          <td class="px-5 py-4 text-sm text-gray-500 dark:text-gray-400 hidden lg:table-cell">{{ user.comments_count ?? 0 }}</td>
          <td class="px-5 py-4">
            <select
              [value]="user.roles?.[0] ?? 'reader'"
              (change)="changeRole(user, $any($event.target).value)"
              class="input text-sm py-1.5 px-2 min-w-[100px]"
            >
              <option value="admin">Admin</option>
              <option value="author">Author</option>
              <option value="reader">Reader</option>
            </select>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div *ngIf="!loading() && lastPage() > 1" class="flex items-center justify-center gap-2">
    <button (click)="prevPage()" [disabled]="currentPage() === 1" class="btn-secondary disabled:opacity-40 disabled:cursor-not-allowed">Prev</button>
    <span class="text-sm text-gray-500 dark:text-gray-400">Page {{ currentPage() }} of {{ lastPage() }}</span>
    <button (click)="nextPage()" [disabled]="currentPage() === lastPage()" class="btn-secondary disabled:opacity-40 disabled:cursor-not-allowed">Next</button>
  </div>
</div>
