<div class="max-w-3xl mx-auto space-y-6">
  <h1 class="text-3xl font-bold text-gray-900">{{ isEdit() ? 'Edit Post' : 'New Post' }}</h1>

  <div *ngIf="error()" class="bg-red-50 text-red-700 p-3 rounded-md">{{ error() }}</div>

  <form (ngSubmit)="submit()" class="space-y-4">
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Title</label>
      <input type="text" [(ngModel)]="title" name="title" class="input" required />
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Excerpt</label>
      <textarea [(ngModel)]="excerpt" name="excerpt" rows="2" class="input" placeholder="Short summary..."></textarea>
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Content (Markdown)</label>
      <textarea [(ngModel)]="content" name="content" rows="12" class="input font-mono" placeholder="Write your post content..." required></textarea>
    </div>

    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Status</label>
        <select [(ngModel)]="status" name="status" class="input">
          <option value="draft">Draft</option>
          <option value="published">Published</option>
        </select>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Published At</label>
        <input type="datetime-local" [(ngModel)]="publishedAt" name="published_at" class="input" />
      </div>
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-2">Categories</label>
      <div class="flex flex-wrap gap-2">
        <label *ngFor="let cat of categories()" class="flex items-center gap-1 cursor-pointer">
          <input type="checkbox"
                 [checked]="selectedCategories().includes(cat.id)"
                 (change)="toggleCategory(cat.id)"
                 class="rounded" />
          <span class="text-sm text-gray-700">{{ cat.name }}</span>
        </label>
      </div>
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-2">Tags</label>
      <div class="flex flex-wrap gap-2">
        <label *ngFor="let tag of tags()" class="flex items-center gap-1 cursor-pointer">
          <input type="checkbox"
                 [checked]="selectedTags().includes(tag.id)"
                 (change)="toggleTag(tag.id)"
                 class="rounded" />
          <span class="text-sm text-gray-700"><span>&#35;</span>{{ tag.name }}</span>
        </label>
      </div>
    </div>

    <div class="flex gap-2">
      <button type="submit" [disabled]="saving()" class="btn-primary disabled:opacity-50">
        {{ saving() ? 'Saving...' : (isEdit() ? 'Update Post' : 'Create Post') }}
      </button>
      <a routerLink="/admin/posts" class="btn-secondary">Cancel</a>
    </div>
  </form>
</div>
