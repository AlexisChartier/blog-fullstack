<div class="max-w-3xl mx-auto space-y-6 animate-fade-in">
  <h1 class="text-2xl sm:text-3xl font-bold text-gray-900 dark:text-white">{{ isEdit() ? 'Edit Post' : 'New Post' }}</h1>

  <div *ngIf="error()" class="bg-red-50 dark:bg-red-900/20 text-red-700 dark:text-red-400 px-4 py-3 rounded-lg text-sm flex items-center gap-2">
    <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
    {{ error() }}
  </div>

  <form (ngSubmit)="submit()" class="card p-6 space-y-5">
    <div>
      <label for="title" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">Title</label>
      <input id="title" type="text" [(ngModel)]="title" name="title" class="input text-lg" placeholder="An awesome title..." required />
    </div>

    <div>
      <label for="excerpt" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">Excerpt</label>
      <textarea id="excerpt" [(ngModel)]="excerpt" name="excerpt" rows="2" class="input resize-none" placeholder="A brief summary shown in post listings..."></textarea>
    </div>

    <div>
      <label for="content" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">Content</label>
      <textarea id="content" [(ngModel)]="content" name="content" rows="14" class="input font-mono text-sm leading-relaxed" placeholder="Write your post content (Markdown supported)..." required></textarea>
      <p class="text-xs text-gray-400 dark:text-gray-600 mt-1.5">Markdown supported. Use # for headings, **bold**, *italic*, `code`, [links](url), etc.</p>
    </div>

    <div>
      <label for="featured_image" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">Featured Image URL <span class="text-gray-400">(optional)</span></label>
      <input id="featured_image" type="url" [(ngModel)]="featuredImage" name="featured_image" class="input" placeholder="https://example.com/image.jpg" />
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <div>
        <label for="status" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">Status</label>
        <select id="status" [(ngModel)]="status" name="status" class="input">
          <option value="draft">Draft</option>
          <option value="published">Published</option>
        </select>
      </div>
      <div>
        <label for="published_at" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">Publish Date</label>
        <input id="published_at" type="datetime-local" [(ngModel)]="publishedAt" name="published_at" class="input" />
      </div>
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2" id="categories-label">Categories</label>
      <div class="flex flex-wrap gap-2" role="group" aria-labelledby="categories-label">
        <label *ngFor="let cat of categories()" class="cursor-pointer">
          <input type="checkbox" [checked]="selectedCategories().includes(cat.id)" (change)="toggleCategory(cat.id)" class="hidden" [attr.aria-label]="cat.name" />
          <span [class]="selectedCategories().includes(cat.id) ? 'badge-primary border-2 border-primary-300 dark:border-primary-700' : 'badge-gray border-2 border-transparent'">
            {{ cat.name }}
          </span>
        </label>
      </div>
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2" id="tags-label">Tags</label>
      <div class="flex flex-wrap gap-2" role="group" aria-labelledby="tags-label">
        <label *ngFor="let tag of tags()" class="cursor-pointer">
          <input type="checkbox" [checked]="selectedTags().includes(tag.id)" (change)="toggleTag(tag.id)" class="hidden" [attr.aria-label]="tag.name" />
          <span [class]="selectedTags().includes(tag.id) ? 'badge-accent border-2 border-accent-300 dark:border-accent-700' : 'badge-gray border-2 border-transparent'">
            <span class="text-gray-400">#</span>{{ tag.name }}
          </span>
        </label>
      </div>
    </div>

    <div class="flex gap-3 pt-2">
      <button type="submit" [disabled]="saving()" class="btn-primary disabled:opacity-50 disabled:cursor-not-allowed">
        <span *ngIf="!saving()">{{ isEdit() ? 'Update Post' : 'Create Post' }}</span>
        <span *ngIf="saving()">Saving...</span>
      </button>
      <a routerLink="/admin/posts" class="btn-secondary">Cancel</a>
    </div>
  </form>
</div>
