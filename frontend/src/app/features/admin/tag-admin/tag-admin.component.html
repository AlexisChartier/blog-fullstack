<div class="space-y-6 animate-fade-in">
  <div class="flex items-center justify-between flex-wrap gap-4">
    <div>
      <h1 class="text-2xl sm:text-3xl font-bold text-gray-900 dark:text-white">Tags</h1>
      <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">Manage blog tags</p>
    </div>
    <button *ngIf="!showForm()" (click)="startCreate()" class="btn-primary">
      <svg class="w-4 h-4 mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
      New Tag
    </button>
  </div>

  <div *ngIf="showForm()" class="card p-6 space-y-4">
    <h2 class="text-lg font-semibold text-gray-900 dark:text-white">{{ editingId() !== null ? 'Edit Tag' : 'New Tag' }}</h2>

    <div *ngIf="error()" class="bg-red-50 dark:bg-red-900/20 text-red-700 dark:text-red-400 px-4 py-3 rounded-lg text-sm">
      {{ error() }}
    </div>

    <div>
      <label for="tag-name" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">Name</label>
      <input id="tag-name" type="text" [(ngModel)]="name" name="name" class="input" placeholder="Tag name..." required />
    </div>

    <div class="flex gap-3">
      <button type="button" (click)="submit()" [disabled]="saving()" class="btn-primary disabled:opacity-50 disabled:cursor-not-allowed">
        <span *ngIf="!saving()">{{ editingId() !== null ? 'Update' : 'Create' }}</span>
        <span *ngIf="saving()">Saving...</span>
      </button>
      <button type="button" (click)="cancelForm()" class="btn-secondary">Cancel</button>
    </div>
  </div>

  <div *ngIf="loading()" class="card p-6 space-y-3">
    <div *ngFor="let i of [1,2,3]" class="skeleton h-12 w-full"></div>
  </div>

  <div *ngIf="!loading()" class="card p-6">
    <div class="flex flex-wrap gap-2">
      <div *ngFor="let tag of tags()" class="inline-flex items-center gap-2 px-3 py-1.5 rounded-lg bg-gray-100 dark:bg-gray-800">
        <span class="text-gray-400">#</span>
        <span class="text-sm font-medium text-gray-900 dark:text-white">{{ tag.name }}</span>
        <span class="text-xs text-gray-400">({{ tag.posts_count ?? 0 }})</span>
        <button (click)="startEdit(tag)" class="text-gray-400 hover:text-primary-600 dark:hover:text-primary-400 ml-1" title="Edit">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
        </button>
        <button (click)="deleteTag(tag.id)" class="text-gray-400 hover:text-red-600 dark:hover:text-red-400" title="Delete">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
        </button>
      </div>
    </div>

    <div *ngIf="tags().length === 0" class="text-center py-8">
      <p class="text-gray-500 dark:text-gray-400 mb-2">No tags yet.</p>
      <button (click)="startCreate()" class="btn-primary text-sm mt-2">Create your first tag</button>
    </div>
  </div>
</div>
