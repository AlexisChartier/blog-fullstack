<div class="space-y-6 animate-fade-in">
  <div class="flex items-center justify-between flex-wrap gap-3">
    <h1 class="text-2xl sm:text-3xl font-bold text-gray-900 dark:text-white">All Posts</h1>
    <a routerLink="/admin/posts/new" class="btn-primary text-sm">
      <svg class="w-4 h-4 mr-1 inline" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
      New Post
    </a>
  </div>

  <div *ngIf="loading()" class="space-y-3">
    <div *ngFor="let i of [1,2,3,4,5]" class="card p-5">
      <div class="skeleton h-5 w-3/4 mb-3"></div>
      <div class="skeleton h-4 w-1/2"></div>
    </div>
  </div>

  <div *ngIf="!loading()" class="card overflow-hidden p-0">
    <table class="w-full">
      <thead>
        <tr class="border-b border-gray-200 dark:border-gray-800 bg-gray-50 dark:bg-gray-900/50">
          <th class="text-left px-5 py-3 text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wider">Title</th>
          <th class="text-left px-5 py-3 text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wider hidden md:table-cell">Author</th>
          <th class="text-left px-5 py-3 text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wider hidden sm:table-cell">Status</th>
          <th class="text-left px-5 py-3 text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wider hidden lg:table-cell">Date</th>
          <th class="text-right px-5 py-3 text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wider">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let post of posts()" class="border-b border-gray-100 dark:border-gray-800/50 hover:bg-gray-50 dark:hover:bg-gray-900/30 transition-colors">
          <td class="px-5 py-4">
            <a [routerLink]="['/post', post.slug]" class="font-medium text-gray-900 dark:text-white hover:text-primary-600 dark:hover:text-primary-400 no-underline">{{ post.title }}</a>
          </td>
          <td class="px-5 py-4 hidden md:table-cell">
            <a [routerLink]="['/profile', post.author?.username]" class="text-sm text-gray-600 dark:text-gray-400 hover:text-primary-600 dark:hover:text-primary-400 no-underline">{{ post.author?.name }}</a>
          </td>
          <td class="px-5 py-4 hidden sm:table-cell">
            <span [class]="post.status === 'published' ? 'badge-primary' : 'badge-gray'">{{ post.status }}</span>
          </td>
          <td class="px-5 py-4 text-sm text-gray-500 dark:text-gray-400 hidden lg:table-cell">{{ post.published_at ? (post.published_at | date: 'MMM d, y') : '—' }}</td>
          <td class="px-5 py-4 text-right">
            <a [routerLink]="['/admin/posts', post.id, 'edit']" class="text-primary-600 dark:text-primary-400 hover:underline text-sm mr-3">Edit</a>
            <button (click)="deletePost(post.id)" class="text-red-600 dark:text-red-400 hover:underline text-sm border-0 bg-transparent cursor-pointer">Delete</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div *ngIf="!loading() && lastPage() > 1" class="flex items-center justify-center gap-2">
    <button (click)="prevPage()" [disabled]="currentPage() === 1" class="btn-secondary disabled:opacity-40 disabled:cursor-not-allowed">Prev</button>
    <span class="text-sm text-gray-500 dark:text-gray-400">Page {{ currentPage() }} of {{ lastPage() }}</span>
    <button (click)="nextPage()" [disabled]="currentPage() === lastPage()" class="btn-secondary disabled:opacity-40 disabled:cursor-not-allowed">Next</button>
  </div>
</div>
