<div class="space-y-6 animate-fade-in">
  <div>
    <h1 class="text-2xl sm:text-3xl font-bold text-gray-900 dark:text-white">Comments</h1>
    <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">Moderate user comments</p>
  </div>

  <div *ngIf="loading()" class="card p-6 space-y-3">
    <div *ngFor="let i of [1,2,3]" class="skeleton h-20 w-full"></div>
  </div>

  <div *ngIf="!loading()" class="space-y-4">
    <div *ngFor="let comment of comments()" class="card p-4 space-y-3">
      <div class="flex items-start justify-between gap-3 flex-wrap">
        <div class="flex items-center gap-2">
          <div class="w-8 h-8 bg-gradient-to-br from-primary-500 to-accent-500 rounded-full flex items-center justify-center text-white text-sm font-bold flex-shrink-0">
            {{ comment.user.name.charAt(0) || 'U' }}
          </div>
          <div>
            <p class="text-sm font-medium text-gray-900 dark:text-white">{{ comment.user.name }}</p>
            <p class="text-xs text-gray-500 dark:text-gray-400">{{ comment.created_at | date: 'MMM d, y h:mm a' }}</p>
          </div>
        </div>
        <div class="flex items-center gap-2">
          <span *ngIf="comment.is_approved" class="badge-green">approved</span>
          <span *ngIf="!comment.is_approved" class="badge-yellow">pending</span>
        </div>
      </div>

      <p class="text-sm text-gray-700 dark:text-gray-300 break-words">{{ comment.content }}</p>

      <div *ngIf="comment.post" class="text-xs text-gray-500 dark:text-gray-400">
        On: <a [routerLink]="['/post', comment.post.slug]" class="text-primary-600 dark:text-primary-400 hover:underline">{{ comment.post.title }}</a>
      </div>

      <div class="flex items-center gap-2 pt-1">
        <button (click)="toggleApproval(comment)" class="btn-ghost text-sm" [class.text-green-600]="!comment.is_approved" [class.text-yellow-600]="comment.is_approved">
          <span *ngIf="!comment.is_approved">Approve</span>
          <span *ngIf="comment.is_approved">Unapprove</span>
        </button>
        <button (click)="deleteComment(comment.id)" class="btn-ghost text-sm text-red-600 hover:bg-red-50 dark:hover:bg-red-900/20">
          Delete
        </button>
      </div>
    </div>

    <div *ngIf="comments().length === 0" class="card p-8 text-center">
      <p class="text-gray-500 dark:text-gray-400">No comments to moderate.</p>
    </div>

    <div *ngIf="!loading() && lastPage() > 1" class="flex items-center justify-center gap-2 pt-4 flex-wrap">
      <button (click)="prevPage()" [disabled]="currentPage() === 1" class="btn-secondary disabled:opacity-40 disabled:cursor-not-allowed">
        <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
        Prev
      </button>
      <span class="text-sm text-gray-500 dark:text-gray-400 px-2">{{ currentPage() }} / {{ lastPage() }}</span>
      <button (click)="nextPage()" [disabled]="currentPage() === lastPage()" class="btn-secondary disabled:opacity-40 disabled:cursor-not-allowed">
        Next
        <svg class="w-4 h-4 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7-7"/></svg>
      </button>
    </div>
  </div>
</div>
