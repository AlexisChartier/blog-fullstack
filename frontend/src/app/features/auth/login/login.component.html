<div class="min-h-[calc(100vh-12rem)] flex items-center justify-center px-4">
  <div class="w-full max-w-md">
    <div class="card p-8 animate-slide-up">
      <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-14 h-14 bg-gradient-to-br from-primary-500 to-accent-500 rounded-2xl mb-4">
          <span class="text-white font-extrabold text-lg">DB</span>
        </div>
        <h1 class="text-2xl font-bold text-gray-900 dark:text-white">Welcome back</h1>
        <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">Sign in to your DevBlog account</p>
      </div>

      <div *ngIf="error()" class="bg-red-50 dark:bg-red-900/20 text-red-700 dark:text-red-400 px-4 py-3 rounded-lg mb-4 text-sm flex items-center gap-2">
        <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        {{ error() }}
      </div>

      <form (ngSubmit)="submit()" class="space-y-4">
        <div>
          <label for="email" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">Email</label>
          <input id="email" type="email" [(ngModel)]="email" name="email" class="input" placeholder="you@example.com" required />
        </div>
        <div>
          <label for="password" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">Password</label>
          <input id="password" type="password" [(ngModel)]="password" name="password" class="input" placeholder="••••••••" required />
        </div>
        <button type="submit" [disabled]="loading()" class="btn-primary w-full disabled:opacity-50">
          <span *ngIf="!loading()">Sign in</span>
          <span *ngIf="loading()">Signing in...</span>
        </button>
      </form>

      <p class="text-center mt-6 text-sm text-gray-600 dark:text-gray-400">
        Don't have an account? <a routerLink="/register" class="link font-medium">Create one</a>
      </p>

      <div class="mt-6 pt-6 border-t border-gray-100 dark:border-gray-800">
        <p class="text-xs text-center text-gray-400 dark:text-gray-600 mb-2">Demo accounts:</p>
        <div class="grid grid-cols-3 gap-2 text-xs">
          <div class="text-center p-2 rounded-lg bg-gray-50 dark:bg-gray-800/50">
            <p class="font-medium text-gray-600 dark:text-gray-400">Admin</p>
            <p class="text-gray-400 dark:text-gray-600">admin&#64;example.com</p>
          </div>
          <div class="text-center p-2 rounded-lg bg-gray-50 dark:bg-gray-800/50">
            <p class="font-medium text-gray-600 dark:text-gray-400">Author</p>
            <p class="text-gray-400 dark:text-gray-600">jane&#64;example.com</p>
          </div>
          <div class="text-center p-2 rounded-lg bg-gray-50 dark:bg-gray-800/50">
            <p class="font-medium text-gray-600 dark:text-gray-400">Reader</p>
            <p class="text-gray-400 dark:text-gray-600">reader&#64;example.com</p>
          </div>
        </div>
        <p class="text-center text-xs text-gray-400 dark:text-gray-600 mt-2">Password: <code class="font-mono bg-gray-100 dark:bg-gray-800 px-1.5 py-0.5 rounded">password</code></p>
      </div>
    </div>
  </div>
</div>
