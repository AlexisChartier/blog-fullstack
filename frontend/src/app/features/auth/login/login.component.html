<div class="max-w-md mx-auto mt-12">
  <h1 class="text-3xl font-bold text-gray-900 mb-6">Login</h1>

  <div *ngIf="error()" class="bg-red-50 text-red-700 p-3 rounded-md mb-4">{{ error() }}</div>

  <form (ngSubmit)="submit()" class="space-y-4">
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
      <input type="email" [(ngModel)]="email" name="email" class="input" placeholder="you@example.com" required />
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
      <input type="password" [(ngModel)]="password" name="password" class="input" placeholder="********" required />
    </div>
    <button type="submit" [disabled]="loading()" class="btn-primary w-full disabled:opacity-50">
      {{ loading() ? 'Logging in...' : 'Login' }}
    </button>
  </form>

  <p class="text-center mt-4 text-gray-600">
    Don't have an account? <a routerLink="/register" class="text-primary-600 font-medium">Register</a>
  </p>
</div>
