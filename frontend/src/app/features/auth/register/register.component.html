<div class="max-w-md mx-auto mt-12">
  <h1 class="text-3xl font-bold text-gray-900 mb-6">Create an Account</h1>

  <div *ngIf="error()" class="bg-red-50 text-red-700 p-3 rounded-md mb-4">{{ error() }}</div>

  <form (ngSubmit)="submit()" class="space-y-4">
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Name</label>
      <input type="text" [(ngModel)]="name" name="name" class="input" required />
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
      <input type="text" [(ngModel)]="username" name="username" class="input" required />
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
      <input type="email" [(ngModel)]="email" name="email" class="input" required />
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
      <input type="password" [(ngModel)]="password" name="password" class="input" required />
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Confirm Password</label>
      <input type="password" [(ngModel)]="passwordConfirmation" name="password_confirmation" class="input" required />
    </div>
    <button type="submit" [disabled]="loading()" class="btn-primary w-full disabled:opacity-50">
      {{ loading() ? 'Creating account...' : 'Register' }}
    </button>
  </form>

  <p class="text-center mt-4 text-gray-600">
    Already have an account? <a routerLink="/login" class="text-primary-600 font-medium">Login</a>
  </p>
</div>
