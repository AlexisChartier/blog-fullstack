<div class="min-h-[calc(100vh-4rem)] flex items-center justify-center px-4 py-12">
  <div class="w-full max-w-md">
    <div class="card p-8 sm:p-10 animate-slide-up">
      <!-- Logo + heading -->
      <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-16 h-16 bg-gradient-to-br from-primary-500 to-accent-500 rounded-2xl mb-5 shadow-lg shadow-primary-500/20">
          <span class="text-white font-extrabold text-xl">DB</span>
        </div>
        <h1 class="text-2xl font-bold text-gray-900 dark:text-white">Create account</h1>
        <p class="text-sm text-gray-500 dark:text-gray-400 mt-1.5">Join the DevBlog community</p>
      </div>

      <!-- Error -->
      <div *ngIf="error" class="bg-red-50 dark:bg-red-900/20 text-red-700 dark:text-red-400 px-4 py-3 rounded-lg mb-5 text-sm flex items-center gap-2 animate-fade-in">
        <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        {{ error }}
      </div>

      <!-- Form -->
      <form (ngSubmit)="submit()" class="space-y-5">
        <div>
          <label for="name" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">Full Name</label>
          <input id="name" type="text" [(ngModel)]="name" name="name" class="input" placeholder="John Doe" required autocomplete="name" />
        </div>
        <div>
          <label for="username" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">Username</label>
          <input id="username" type="text" [(ngModel)]="username" name="username" class="input" placeholder="johndoe" required autocomplete="username" />
        </div>
        <div>
          <label for="email" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">Email</label>
          <input id="email" type="email" [(ngModel)]="email" name="email" class="input" placeholder="you@example.com" required autocomplete="email" />
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label for="password" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">Password</label>
            <input id="password" type="password" [(ngModel)]="password" name="password" class="input" placeholder="Min. 8 characters" required autocomplete="new-password" />
          </div>
          <div>
            <label for="password_confirmation" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">Confirm</label>
            <input id="password_confirmation" type="password" [(ngModel)]="passwordConfirmation" name="password_confirmation" class="input" placeholder="Repeat password" required autocomplete="new-password" />
          </div>
        </div>
        <button type="submit" [disabled]="loading()" class="btn-primary w-full disabled:opacity-50 disabled:cursor-not-allowed">
          <span *ngIf="!loading()">Create account</span>
          <span *ngIf="loading()" class="flex items-center justify-center gap-2">
            <svg class="w-4 h-4 animate-spin" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
            Creating...
          </span>
        </button>
      </form>

      <p class="text-center mt-6 text-sm text-gray-600 dark:text-gray-400">
        Already have an account? <a routerLink="/login" class="link font-medium">Sign in</a>
      </p>
    </div>
  </div>
</div>
