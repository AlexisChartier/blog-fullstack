services:
  db:
    image: postgres:16-alpine
    container_name: blog-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-blogging}
      POSTGRES_USER: ${POSTGRES_USER:-blog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - blog-network

  redis:
    image: redis:7-alpine
    container_name: blog-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - blog-network

  adminer:
    image: adminer:latest
    container_name: blog-adminer
    ports:
      - "${ADMINER_PORT:-8081}:8080"
    depends_on:
      - db
    networks:
      - blog-network

  backend:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: blog-backend
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-blogging}
      DB_USERNAME: ${POSTGRES_USER:-blog}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-secret}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - db
      - redis
    networks:
      - blog-network

  frontend:
    build:
      context: .
      dockerfile: docker/node/Dockerfile
    container_name: blog-frontend
    working_dir: /app
    environment:
      SSR_API_URL: http://nginx:80/api
    ports:
      - "${FRONTEND_PORT:-4000}:4000"
    depends_on:
      - backend
    networks:
      - blog-network

  nginx:
    image: nginx:alpine
    container_name: blog-nginx
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./backend:/var/www/html
    depends_on:
      - backend
    networks:
      - blog-network

networks:
  blog-network:
    driver: bridge

volumes:
  pgdata:
  redisdata:
