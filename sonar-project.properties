sonar.projectKey=AlexisChartier_blog-fullstack
sonar.projectName=Multi-User Blogging System
sonar.projectDescription=Full-stack blog with Angular 17 SSR + Laravel 11
sonar.organization=alexischartier

# Source directories (production code only)
sonar.sources=backend/app,frontend/src/app

# Test directories (test files only)
sonar.tests=backend/tests,frontend/src
sonar.test.inclusions=backend/tests/**/*.php,frontend/src/**/*.spec.ts

# Coverage report paths
sonar.php.coverage.reportPaths=backend/coverage/coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# Exclusions — exclude non-source files from analysis
sonar.exclusions=backend/database/migrations/**,backend/vendor/**,frontend/node_modules/**,frontend/dist/**,**/*.config.*,**/*.spec.ts

# Coverage exclusions — exclude test files and non-source files from coverage calculation
sonar.coverage.exclusions=backend/database/**,backend/tests/**,frontend/src/**/*.spec.ts,frontend/src/testing/**

# Encoding
sonar.sourceEncoding=UTF-8
